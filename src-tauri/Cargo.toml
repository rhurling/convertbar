[package]
name = "convertbar"
version = "0.13.2"
description = "Menu bar app for batch video conversion using HandBrakeCLI"
authors = ["Rouven Hurling"]
edition = "2021"
license = "MIT"
repository = "https://github.com/rhurling/convertbar"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "convertbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
trash = "5"
regex = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
notify = "8"
tauri-plugin-notification = "2"
dunce = "1.0.5"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
# Enables tauri::test (MockRuntime) for the process_queue / cancel integration tests.
tauri = { version = "2", features = ["test"] }

