name: "publish"

on:
  push:
    tags:
      - "v*"

# Serialize runs for the same tag, but never cancel an in-flight release build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default to no permissions; each job opts into the minimum scopes it needs.
permissions: {}

jobs:
  # One job creates the draft, and every other job uploads to it by id. When each matrix leg
  # looked the draft up by tag and created it if missing, two legs racing on v2.7.1 created
  # two drafts: publish-release published the macOS one, and the Linux and Windows assets and
  # their latest.json platforms were stranded in the other. All jobs were green, and an
  # immutable release cannot take them afterwards.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
      body: ${{ steps.release_body.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build release body
        id: release_body
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          CURRENT=$(git describe --tags --abbrev=0)
          ./scripts/release-notes.sh "$PREV" "$CURRENT" > "$RUNNER_TEMP/notes.md"
          # Heredoc, not `echo "body=..."`: a multi-line value written as key=value makes the
          # runner fail the step with "Invalid format", and any notes line containing `=`
          # would be parsed as a further output.
          {
            echo "body<<CONVERTBAR_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo "CONVERTBAR_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Re-running the whole workflow reuses the draft instead of creating a second one. A
      # published release for the tag is refused: it is immutable, so nothing can be added.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only the list endpoint shows drafts; /releases/tags/{tag} does not.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == $ENV.GITHUB_REF_NAME) | "\(.id) \(.draft)"' \
            > "$RUNNER_TEMP/existing"
          if grep -q ' false$' "$RUNNER_TEMP/existing"; then
            echo "::error::$GITHUB_REF_NAME is already published"; exit 1
          fi
          case $(wc -l < "$RUNNER_TEMP/existing" | tr -d ' ') in
            0) id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                 -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" \
                 -F draft=true -F prerelease=false -F body=@"$RUNNER_TEMP/notes.md" --jq .id) ;;
            1) id=$(cut -d' ' -f1 "$RUNNER_TEMP/existing") ;;
            *) echo "::error::several drafts carry $GITHUB_REF_NAME; delete all but one"
               cat "$RUNNER_TEMP/existing"; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write # upload artifacts to the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust_targets: ""
          - platform: "windows-latest"
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # The bundler skips notarization with only a *warning* when the API-key
      # variables are absent, and falls back to an ad-hoc signature when the
      # certificate is absent. Both failure modes produce a release that looks
      # fine and silently breaks every user's TCC permission grants. Refuse to
      # build instead.
      - name: Require macOS signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set — refusing to publish an unsigned macOS build"
              missing=1
            fi
          done
          exit $missing

      # Tauri reads a *path* to the App Store Connect key, so the base64 secret
      # has to become a file. Named AuthKey_<KEYID>.p8 because some Apple
      # tooling infers the key ID from the filename. $RUNNER_TEMP is outside the
      # checkout, so no bundler glob or stray `git add` can pick it up.
      - name: Materialize the App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ". -> target"
          # Restore-only, never save. Releases are infrequent (tag pushes), but save-if:true
          # stacked a fresh ~500MB cache per platform on every version bump, pushing the repo
          # past GitHub's 10GB cache limit and LRU-evicting the test.yml caches — which then
          # cold-compiled the full dep tree (~136s on ubuntu vs ~26s warm). Trade a cold
          # release build for reliably-warm PR/CI test caches.
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing; ignored on the Linux and Windows legs. The Tauri
          # CLI imports APPLE_CERTIFICATE into a temporary keychain itself, so no
          # manual `security create-keychain` step is needed here.
          # APPLE_API_KEY_PATH is exported into GITHUB_ENV by an earlier step.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          # Upload to the draft by id, never by tag (see create-release). Immutable
          # releases seal a release on publish, so it must stay a draft until all
          # builds finish; publish-release finalizes it.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Becomes latest.json's `notes`.
          releaseBody: ${{ needs.create-release.outputs.body }}
          args: ${{ matrix.args }}

      # tauri-action has already uploaded to the draft by now, but publish-release
      # needs every matrix leg green, so failing here leaves the release a draft.
      #
      # Notarization itself is already gated: the bundler waits for Apple's verdict
      # and fails the build on rejection. So this asserts only what is decidable
      # offline and deterministically, and reports the network-dependent Gatekeeper
      # verdict as a warning. Every threshold below was measured on a real signed
      # build (2026-07-29): app stapled, dmg NOT stapled (signed but never
      # submitted), updater tarball stapled.
      - name: Verify the macOS bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # -print -quit, not `| head -1`: no pipe means no SIGPIPE interaction
          # with pipefail, and it cannot silently pick an arbitrary bundle.
          app=$(find target -maxdepth 6 -name 'ConvertBar.app' -type d -print -quit)
          [ -n "$app" ] || { echo "::error::no ConvertBar.app found"; exit 1; }

          codesign --verify --strict --verbose=2 "$app"

          desc=$(codesign -dvv "$app" 2>&1)
          grep -q 'flags=.*runtime' <<<"$desc" \
            || { echo "::error::hardened runtime missing"; exit 1; }
          grep -q 'Authority=Developer ID Application' <<<"$desc" \
            || { echo "::error::not signed with a Developer ID Application cert"; exit 1; }

          xcrun stapler validate "$app" \
            || { echo "::error::notarization ticket is not stapled to the app"; exit 1; }

          # Advisory, not gating: an unstapled updater artifact still works, it just
          # costs auto-updating users an online Gatekeeper check on first launch.
          updater=$(find target -maxdepth 6 -name 'ConvertBar.app.tar.gz' -print -quit)
          if [ -n "$updater" ]; then
            work=$(mktemp -d)
            tar -xzf "$updater" -C "$work"
            xcrun stapler validate "$work/ConvertBar.app" \
              || echo "::warning::updater tarball is not stapled (Tauri bundling order may have changed)"
          fi

          # Advisory: needs network. Captured rather than piped, because
          # `spctl | tee | grep -q` goes non-zero under pipefail when grep exits
          # early and tee takes SIGPIPE — printing this on a healthy build.
          verdict=$(spctl -a -vvv --type execute "$app" 2>&1) || true
          echo "$verdict"
          grep -q 'source=Notarized Developer ID' <<<"$verdict" \
            || echo "::warning::spctl did not report a notarized Developer ID"

  # The headless server for macOS hosts (the Docker image is linux/amd64 only). It runs
  # under a LaunchAgent and reaches LAN hosts over ssh, and macOS keys that local-network
  # grant on the code signature, so it ships Developer ID-signed and notarized like the
  # app (ADR 0001). Runs beside the app legs: create-release has made the draft it uploads to.
  publish-server-darwin:
    needs: create-release
    runs-on: macos-latest
    # A stalled notarization must not pin the release as a draft for the 6h default.
    timeout-minutes: 60
    permissions:
      contents: write # upload the asset to the drafted release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same reasoning as the app legs' preflight: a missing secret must fail the
      # build, never produce an ad-hoc-signed or unnotarized asset.
      - name: Require macOS signing credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set — refusing to publish an unsigned server asset"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ". -> target"
          save-if: false # restore-only, same as the app legs

      # The web UI is embedded at compile time; without dist-web the server builds fine
      # and serves nothing.
      - name: Build the server
        run: |
          set -euo pipefail
          npm ci
          npm run build:web
          cargo build --release -p convertbar-server --target aarch64-apple-darwin
          version=$(cargo pkgid -p convertbar-server | sed 's/.*[@#]//')
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::crate version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          echo "SERVER_ZIP=convertbar-server_${version}_aarch64-apple-darwin.zip" >> "$GITHUB_ENV"

      # A temporary keychain outside the checkout, as the Tauri CLI does for the app.
      - name: Sign and package
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/server-signing.keychain-db"
          kc_pass=$(openssl rand -base64 24)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          KEYCHAIN="$keychain" scripts/package-server-macos.sh \
            target/aarch64-apple-darwin/release/convertbar-server \
            "$APPLE_SIGNING_IDENTITY" "$SERVER_ZIP"

      # notarytool waits for Apple's verdict, but its exit code alone is not trusted:
      # the status must read Accepted. A bare binary cannot be stapled, so Gatekeeper
      # checks the ticket online when it checks at all.
      - name: Notarize
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          # `|| true`: if notarytool exits non-zero on a rejection, the verdict and the log
          # fetch below must still run, or the failure carries no submission id.
          result=$(xcrun notarytool submit "$SERVER_ZIP" --key "$key_path" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m --output-format json) || true
          echo "$result"
          status=$(jq -r .status <<<"$result")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id <<<"$result")" --key "$key_path" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::notarization status is $status, not Accepted"
            exit 1
          fi

      # By id, not `gh release upload <tag>`: gh resolves a tag to one arbitrary release when
      # two drafts share it. Delete-then-upload replaces the asset on a re-run.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == $ENV.SERVER_ZIP) | .id')
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi
          gh api -X POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$SERVER_ZIP" \
            -H "Content-Type: application/zip" --input "$SERVER_ZIP" --silent

  # Publishing is the event that seals an immutable release, so it runs once,
  # after every platform has uploaded to the draft.
  publish-release:
    needs: [create-release, publish-tauri, publish-server-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write # flip the drafted release to published
    steps:
      # Green legs are not proof of a complete release: v2.7.1 published with half its
      # platforms. The legs also merge their platforms into one shared latest.json, a
      # read-modify-write that a near-simultaneous finish can lose. Publishing is the last
      # moment anything can be added, so check the draft itself. On a failure, re-run the
      # leg(s) whose platforms are missing, then this job.
      - name: Refuse an incomplete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api "$release" --jq '.assets[] | "\(.id) \(.name)"' > assets
          grep -q ' convertbar-server_.*_aarch64-apple-darwin\.zip$' assets \
            || { echo "::error::the darwin server asset is missing"; exit 1; }
          manifest=$(grep ' latest\.json$' assets | cut -d' ' -f1) \
            || { echo "::error::latest.json is missing"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$manifest" \
            -H "Accept: application/octet-stream" > latest.json
          missing=0
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json > /dev/null \
              || { echo "::error::latest.json has no $platform"; missing=1; }
          done
          exit $missing

      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
