name: "publish"

on:
  push:
    tags:
      - "v*"

# Serialize runs for the same tag, but never cancel an in-flight release build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default to no permissions; each job opts into the minimum scopes it needs.
permissions: {}

jobs:
  publish-tauri:
    permissions:
      contents: write # create the GitHub release and upload artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust_targets: ""
          - platform: "windows-latest"
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build release body
        id: release_body
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          CURRENT=$(git describe --tags --abbrev=0)
          if [ -n "$PREV" ]; then
            echo "body=**Full changelog**: https://github.com/rhurling/convertbar/compare/${PREV}...${CURRENT}" >> $GITHUB_OUTPUT
          else
            echo "body=Initial release." >> $GITHUB_OUTPUT
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          # Restore-only, never save. Releases are infrequent (tag pushes), but save-if:true
          # stacked a fresh ~500MB cache per platform on every version bump, pushing the repo
          # past GitHub's 10GB cache limit and LRU-evicting the test.yml caches — which then
          # cold-compiled the full dep tree (~136s on ubuntu vs ~26s warm). Trade a cold
          # release build for reliably-warm PR/CI test caches.
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          # Upload to a draft so every matrix platform can attach its assets.
          # Immutable releases seal a release on publish, so it must stay a
          # draft until all builds finish; publish-release finalizes it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publishing is the event that seals an immutable release, so it runs once,
  # after every platform has uploaded to the draft.
  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write # flip the drafted release to published
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
