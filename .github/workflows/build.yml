name: "publish"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Default to no permissions; each job opts into the minimum scopes it needs.
permissions: {}

jobs:
  publish-tauri:
    permissions:
      contents: write # create the GitHub release and upload artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            rust_targets: ""
          - platform: "windows-latest"
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build release body
        id: release_body
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          CURRENT=$(git describe --tags --abbrev=0)
          if [ -n "$PREV" ]; then
            echo "body=**Full changelog**: https://github.com/rhurling/convertbar/compare/${PREV}...${CURRENT}" >> $GITHUB_OUTPUT
          else
            echo "body=Initial release." >> $GITHUB_OUTPUT
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          # Upload to a draft so every matrix platform can attach its assets.
          # Immutable releases seal a release on publish, so it must stay a
          # draft until all builds finish; publish-release finalizes it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publishing is the event that seals an immutable release, so it runs once,
  # after every platform has uploaded to the draft.
  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write # flip the drafted release to published
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
