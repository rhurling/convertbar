name: test-windows

# Advisory Windows coverage on PRs that touch the Rust backend. The main `test` workflow
# runs Windows only on push to main, so Windows-only breakage (e.g. path-separator bugs)
# has landed post-merge. This job surfaces it pre-merge. It is intentionally NOT a required
# check — the ruleset gates on `frontend` + `rust (ubuntu-22.04)` only — so a slow or flaky
# Windows run never blocks a merge. Gated on src-tauri/** so frontend-only PRs skip it
# (Windows minutes bill 2x); a separate workflow keeps that path filter off the frontend job.
# Never make rust-windows a required check: the paths filter means it reports no status at
# all on frontend-only PRs, which would wait forever on "Expected".
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-windows.yml"

# cargo test runs untrusted lockfile code — keep the token read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: ". -> target"
          # Match test.yml's key so this PR-only job restores the warm Windows cache
          # main builds, instead of cold-building. save-if: false → never writes a
          # PR-scoped cache that would be orphaned on merge (the old ~628MB/PR leak).
          shared-key: "rust-tests"
          save-if: false
      # --lib + RUSTFLAGS: the mock-runtime tests need a Common-Controls v6 manifest or
      # the test exe dies at load (STATUS_ENTRYPOINT_NOT_FOUND, tauri-apps/tauri#11028).
      # --lib keeps the app binary out of this cargo invocation, which would otherwise
      # get a second manifest on top of tauri-build's. All tests live in the lib.
      - run: cargo test --lib -p convertbar && cargo test --lib -p convertbar-core
        shell: bash
        env:
          RUSTFLAGS: -Clink-arg=/MANIFEST:EMBED -Clink-arg=/MANIFESTINPUT:${{ github.workspace }}\src-tauri\windows-test-manifest.xml
