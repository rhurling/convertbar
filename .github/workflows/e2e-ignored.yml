name: e2e-ignored

# The two #[ignore]d end-to-end tests (probe.rs, commands/queue.rs) need a real
# HandBrakeCLI + ffmpeg, so the PR/main `test` workflow never runs them and nothing
# enforces they still pass against reality. This job installs both encoders and runs
# `cargo test -- --ignored` weekly and on every push to main, surfacing e2e breakage
# near the change instead of at release time. It is not a required PR check.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ignored-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux dependencies + encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            handbrake-cli ffmpeg
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored
