name: e2e-ignored

# The #[ignore]d end-to-end tests (probe.rs, commands/queue.rs, converter.rs) need a
# real HandBrakeCLI + ffmpeg, so the PR/main `test` workflow never runs them and nothing
# enforces they still pass against reality. This job installs both encoders and runs
# `cargo test -- --ignored` weekly and on every push to main, surfacing e2e breakage
# near the change instead of at release time. It is not a required PR check.
# Note: GitHub auto-disables cron schedules after ~60 days without repo activity (email
# notice only). Pushes keep it alive; on a dormant repo re-enable it in the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ignored-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies + encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            handbrake-cli ffmpeg
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ". -> target"
      - run: cargo test --workspace -- --ignored
