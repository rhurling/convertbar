name: test

on:
  push:
    branches: [main]
  pull_request:

# npm ci / cargo test run untrusted lockfile code — keep the token read-only.
permissions:
  contents: read

# Cancel superseded PR runs when a new commit is pushed; let every push to main
# run its full matrix to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # tsc type-check + vite build — mirrors the release build, which CI otherwise never exercises

  rust:
    strategy:
      fail-fast: false
      matrix:
        # PRs run ubuntu only; push to main runs the full matrix. macOS/Windows runner
        # minutes bill 10x/2x against the free allowance, so cross-platform is verified
        # post-merge (and by the release build) instead of on every PR.
        platform: ${{ fromJSON(github.event_name == 'push' && '["macos-latest", "ubuntu-22.04", "windows-latest"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # Plain apt, not cache-apt-pkgs-action: that action captures only
        # newly-installed files, so on this GTK/webkit tree it cached 0 packages and
        # left gdk-3.0/libgtk-3-dev missing, breaking the build (runner-state-dependent:
        # green on cache-miss, red on the next run). apt-get pulls the full dep tree.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          # Fixed shared-key (not the per-job default) so test-windows.yml restores this
          # same Windows cache instead of cold-building and orphaning a PR-scoped cache.
          shared-key: "rust-tests"
          # Only main writes caches; PRs restore-only, so merged PRs leave no orphans.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: runner.os != 'Windows'
      # --lib + RUSTFLAGS: the mock-runtime tests need a Common-Controls v6 manifest or
      # the test exe dies at load (STATUS_ENTRYPOINT_NOT_FOUND, tauri-apps/tauri#11028).
      # --lib keeps the app binary out of this cargo invocation, which would otherwise
      # get a second manifest on top of tauri-build's. All tests live in the lib.
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -Clink-arg=/MANIFEST:EMBED -Clink-arg=/MANIFESTINPUT:${{ github.workspace }}\src-tauri\windows-test-manifest.xml
